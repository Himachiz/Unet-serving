name: CI

on: [push, pull_request]

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t segmentation-service .

      # The runner has no checkpoint -- it is gitignored, deliberately.
      # A randomly initialised one is enough to prove the service starts.
      # Generated inside the image, which already has torch.
      - name: Fetch the released model
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch_model.sh


      - name: Start the service
        run: |
          docker run -d -p 8000:8000 \
            -v "$PWD/checkpoints:/srv/checkpoints" \
            -v "$PWD/samples:/srv/samples" \
            -e WEIGHTS=checkpoints/unet_lung_best.pt \
            --name seg segmentation-service
      - name: Smoke test
        run: |
          for i in $(seq 30); do
            if curl -fs "localhost:8000/predict?image=samples/MCUCXR_0001_0.png" -o out.json; then
              cat out.json
              python -c "
          import json, sys
          frac = json.load(open('out.json'))['lung_fraction']
          if not 0.10 < frac < 0.45:
              sys.exit(f'implausible lung_fraction: {frac}')
          print(f'lung_fraction {frac:.3f} is plausible')"
              exit 0
            fi
            sleep 1
          done
          echo "service never answered"; docker logs seg; exit 1
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" \
          | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push, tagged by commit
        run: |
          IMAGE=ghcr.io/himachiz/unet-serving
          docker tag segmentation-service $IMAGE:${{ github.sha }}
          docker tag segmentation-service $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
